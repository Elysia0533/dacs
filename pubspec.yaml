name: online_story_reader
description: "A Flutter reader app for EPUB, PDF, TXT, and Google Drive stories."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  file_picker: ^11.0.2
  epub_view: ^3.2.0
  syncfusion_flutter_pdfviewer: ^33.2.5
  uuid: ^4.5.3
  path_provider: ^2.1.5
  image: ^3.3.0
  flutter_tts: ^4.2.0
  google_fonts: ^6.2.1
  flutter_html: ^3.0.0-beta.2
  epubx: ^4.0.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  archive: ^3.6.1
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/covers/
    - assets/offline_stories/
